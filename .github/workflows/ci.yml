name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
      - run: test -z "$(gofmt -l .)"
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0 generate
      - run: git diff --exit-code -- internal/db/dbgen
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli lint api/openapi.yaml
