x-app: &app
  build: .
  image: attendance-api

# All values below read from the repository-root .env when present, falling back
# to local-development defaults so `docker compose up` works out of the box.
# Containerized services always connect to the bundled `postgres` service;
# DATABASE_URL in .env is only for Go commands running on the host.
# For a real deployment prefer the Render Blueprint (render.yaml).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendance}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendance} -d ${POSTGRES_DB:-attendance}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    <<: *app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD:-attendance}@postgres:5432/${POSTGRES_DB:-attendance}?sslmode=disable
    command: ["sh", "-c", "goose -dir /app/db/migrations postgres \"$$DATABASE_URL\" up"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD:-attendance}@postgres:5432/${POSTGRES_DB:-attendance}?sslmode=disable
      TZ: Africa/Lagos
    command: ["sh", "-c", "seed || echo 'SEED DID NOT COMPLETE: it may already be loaded. Read the messages above.'"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    # Compose runs migrate + seed as their own services, so the API just serves.
    command: ["api"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD:-attendance}@postgres:5432/${POSTGRES_DB:-attendance}?sslmode=disable
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy-123456}
      CODE_HMAC_SECRET: ${CODE_HMAC_SECRET:-local-code-secret-change-before-deploy-123456}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEVICE_OFFLINE_SECONDS: ${DEVICE_OFFLINE_SECONDS:-60}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Campus Attendance <noreply@example.test>}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres-data:
