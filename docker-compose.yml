services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://attendance:attendance@postgres:5432/attendance?sslmode=disable
      ALLOWED_ORIGIN: http://localhost:5173
      JWT_SECRET: local-development-secret-change-before-deploy-123456
      CODE_HMAC_SECRET: local-code-secret-change-before-deploy-123456
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
      DEVICE_OFFLINE_SECONDS: 60
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
