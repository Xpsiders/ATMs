# Render Blueprint for the Campus Attendance API (backend only).
#
# NOTE: Render Blueprints require a PAID workspace. On the FREE tier, do NOT use
# this file - instead create the service by hand in the dashboard:
#   New + -> Web Service -> connect this repo -> Runtime: Docker -> Instance: Free
#   Settings -> Docker Command (overrides the Dockerfile CMD):
#     sh -c "goose -dir /app/db/migrations postgres \"$DATABASE_URL\" up && (seed || echo 'seed skipped') && exec api"
#   Settings -> Health Check Path: /healthz
#   Environment -> add every variable listed under envVars below (generate
#     JWT_SECRET and CODE_HMAC_SECRET yourself, e.g. `openssl rand -base64 48`).
# This file stays valid for when you move to a paid plan and want one-click IaC.
#
# Fill the values marked EDIT in the Render dashboard after the first deploy.
#
# Database: this uses an EXTERNAL PostgreSQL via the DATABASE_URL you paste in
# (recommended: a free Neon or Supabase database - they don't expire, unlike
# Render's free Postgres). You can also paste a Render-managed database's URL.
# Whatever the source, the URL must allow TLS; append ?sslmode=require if needed.
#
# Free tier notes:
#   - Pre-deploy commands aren't available on free instances, so migrations and
#     the seed run at container startup (see dockerCommand) instead. Both are
#     idempotent, so re-running on every cold start is safe.
#   - Free web services sleep after ~15 min idle; the first request after that
#     cold-starts (and re-runs migrate/seed), so expect a slow first hit.
#
# Frontend: deployed separately on Vercel. Set ALLOWED_ORIGIN (below) to the
# Vercel production URL, and set VITE_API_BASE_URL on Vercel to this API's URL.

services:
  - type: web
    name: attendance-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    # Free tier has no pre-deploy hook, so migrate + seed, then start the API.
    # goose and seed are idempotent; exec api makes the server the main process.
    dockerCommand: >-
      sh -c "goose -dir /app/db/migrations postgres \"$DATABASE_URL\" up && (seed || echo 'seed skipped') && exec api"
    envVars:
      - key: DATABASE_URL
        sync: false # EDIT: external Postgres URL, e.g. postgres://user:pass@host/db?sslmode=require
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none # required: API (Render) and frontend (Vercel) are different sites
      - key: DEVICE_OFFLINE_SECONDS
        value: "60"
      - key: JWT_SECRET
        generateValue: true # Render generates a long random value (>= 32 bytes)
      - key: CODE_HMAC_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false # EDIT: allowed CORS origins, comma-separated. e.g. https://campuscheck.vercel.app,https://*.vercel.app (the *.vercel.app entry allows preview deploys; omit it for tighter security). No trailing slash.
      - key: MAIL_FROM
        sync: false # EDIT: e.g. "Campus Attendance <noreply@yourdomain>"
      - key: MAIL_API_KEY
        sync: false # EDIT: transactional-email API key (leave blank only if email is not needed yet)
      # --- seed placement (so check-ins work from your real location) ---
      - key: TZ
        value: Africa/Lagos
      - key: SEED_VENUE_RADIUS_M
        value: "150"
      - key: SEED_ORIGIN_LAT
        sync: false # EDIT: latitude of your real venue location
      - key: SEED_ORIGIN_LNG
        sync: false # EDIT: longitude of your real venue location
      # PORT is injected by Render and the app binds it automatically.
