    delete:
      operationId: deleteCourse
      summary: Delete a course
      description: Allowed for administrators with authority over the course's department. A course that still has offerings cannot be deleted; remove its offerings first.
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceId"}]
      responses:
        "204": {description: Course deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this course., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: Course not found., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "409": {description: Course still has offerings and cannot be deleted., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /offerings:
    get:
      operationId: listOfferings
      summary: List course offerings
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Offset"}]
      responses:
        "200": {description: Paginated course offerings., content: {application/json: {schema: {$ref: "#/components/schemas/PagedCatalogueItems"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: createOffering
      summary: Create a course offering
      description: >-
        An administrator over the course's department (department/faculty/
        institution/platform admin), or a lecturer who owns the course's
        department, creates the offering directly and receives 201. A lecturer
        without department ownership instead files a teaching request for admin
        review and receives 202. Administrators create the offering with no
        coordinator and assign lecturers afterwards via PUT
        /offerings/{id}/lecturers.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id, semester_id, level, registration_mode, roster_policy, min_attendance_pct]
              additionalProperties: false
              properties:
                course_id: {type: string, format: uuid}
                semester_id: {type: string, format: uuid}
                level: {type: integer, minimum: 1}
                registration_mode:
                  type: string
                  enum: [auto, open, approval, closed]
                  description: >-
                    How students join this offering. The two primary choices a
                    frontend typically surfaces as a Self-register / Needs
                    approval toggle are: open = students register themselves and
                    are approved immediately; approval = students register and a
                    lecturer or admin must approve each request. The advanced
                    options are: auto = matching department-and-level students
                    are enrolled automatically (at claim time); closed = no new
                    registrations are accepted.
                roster_policy: {type: string, enum: [registered_only, open]}
                min_attendance_pct: {type: number, minimum: 0, maximum: 100}
                late_counts_as_attended: {type: boolean}
                auto_targets:
                  type: array
                  items:
                    type: object
                    required: [department_id, level]
                    additionalProperties: false
                    properties:
                      department_id: {type: string, format: uuid}
                      level: {type: integer, minimum: 1}
                timetable:
                  type: array
                  items:
                    type: object
                    required: [weekday, starts_at, ends_at, venue_id]
                    additionalProperties: false
                    properties:
                      weekday: {type: integer, minimum: 0, maximum: 6}
                      starts_at: {type: string, format: time}
                      ends_at: {type: string, format: time}
                      venue_id: {type: string, format: uuid}
      responses:
        "201": {description: Offering created., content: {application/json: {schema: {$ref: "#/components/schemas/CatalogueItem"}}}}
        "202": {description: Teaching request created because the lecturer does not own the course's department., content: {application/json: {schema: {type: object, required: [status, teaching_request_id], properties: {status: {type: string, enum: [pending]}, teaching_request_id: {type: string, format: uuid}}}}}}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "Caller is neither an administrator over the course's department nor a lecturer, so cannot create an offering for this course.", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /offerings/{id}:
    get:
