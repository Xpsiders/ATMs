        "200": {description: Auto-registration targets replaced., content: {application/json: {schema: {type: object, required: [targets], properties: {targets: {type: array, items: {$ref: "#/components/schemas/AutoTarget"}}}}}}}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this offering., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /device/scans:
    post:
      operationId: createDeviceScan
      summary: Record a fingerprint scan for the session active at scan time
      description: When client_scanned_at is supplied for a late-synced offline scan, the server associates the scan with the session that was active at the device venue at that timestamp. Omit it for a live scan.
      security:
        - DeviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceScanRequest"
      responses:
        "201":
          description: New fingerprint scan recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceScanResponse"
        "200":
          description: Scan was already recorded for this session and student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceScanResponse"
        "400":
          description: Invalid JSON, slot, or confidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/InvalidDeviceKey"
        "409":
          description: No session is currently open at this device's venue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: no_active_session
                  message: There is no open session at this device venue
                  details: {}
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /device/scans/batch:
    post:
      operationId: createDeviceScanBatch
      summary: Flush up to 100 queued scans independently
      description: Each item receives its own result; invalid scans do not prevent valid queue items from being processed. Retry only items that were not successfully recorded.
      security:
        - DeviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scans]
              properties:
                scans:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/DeviceScanRequest"
      responses:
        "200":
          description: Per-item results in request order.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [index, result]
                      properties:
                        index:
                          type: integer
                        result:
                          $ref: "#/components/schemas/DeviceScanResponse"
        "400":
          description: Invalid JSON or batch size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/InvalidDeviceKey"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /device/enrolments/{id}/complete:
    post:
      operationId: completeDeviceEnrolment
      summary: Mark a pending fingerprint enrolment done or failed
      security:
        - DeviceKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [done, failed]
                template:
                  type: string
                  description: >-
                    Base64-encoded fingerprint template exported from the sensor.
                    Send it with status=done so the backend stores it centrally
                    and other scanners can recognise this student (multi-venue).
                    Optional; omit to keep the print local to this sensor only.
      responses:
        "204":
          description: Enrolment task completed.
        "400":
          description: Invalid task ID, JSON, or status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/InvalidDeviceKey"
        "404":
          description: Pending task not found for this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /device/pair:
    post:
      operationId: pairDevice
      summary: Redeem a pairing code for a permanent device key
      security: [] # public: the device has no key yet
      description: >-
        Called once by scanner firmware on first boot with the pairing code that
        was flashed into the image. Returns the permanent device key the firmware
        stores and sends as X-Device-Key on all later requests. The code is
        single-use and expires. No device key is required to call this route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_code]
              additionalProperties: false
              properties:
                pairing_code:
                  type: string
                  description: The pairing code, accepted in any casing or grouping.
      responses:
        "200":
          description: Device paired; permanent key returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairResponse"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Pairing code is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /device/status:
    post:
      operationId: recordDeviceStatus
      summary: Report scanner health telemetry
      description: Updates the scanner's firmware version, battery, pending offline-queue depth, and free storage. All fields are optional; only supplied fields are updated.
      security:
        - DeviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceStatusRequest"
      responses:
        "204":
          description: Status recorded.
        "400":
          description: Invalid JSON or telemetry value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/InvalidDeviceKey"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /device/templates/sync:
    post:
      operationId: syncDeviceTemplates
      summary: Load the session roster's fingerprint templates onto the scanner
      description: >-
        Returns the central fingerprint templates for the roster of the session
        currently open at this scanner's venue (or the session_id given), each
        with the integer slot position the scanner should load it into. The
        backend provisions/persists that slot map, so later scans reference each
        student by slot_number. Call this when a session starts; a scanner enrols
        on any sensor but is recognised wherever its roster is synced.
      security:
        - DeviceKey: []
      parameters:
        - name: session_id
          in: query
          required: false
          description: The session whose roster to load. Defaults to the session currently open at the device's venue.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Roster templates and their slot positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTemplateSync"
        "400":
          description: Invalid session_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/InvalidDeviceKey"
        "409":
          description: No open session at this device's venue (and no session_id given).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: attendance_refresh
    DeviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    CatalogueItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
      additionalProperties: true
    StudentImportPreview:
      type: object
      required: [rows, errors]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [line, matric_no, email, display_name, department_id, level]
            properties:
              line:
                type: integer
              matric_no:
                type: string
              email:
                type: string
                format: email
              display_name:
                type: string
              department_id:
                type: string
                format: uuid
              level:
                type: integer
        errors:
          type: array
          items:
            type: object
            required: [line, message]
            properties:
              line:
                type: integer
              column:
                type: string
              message:
                type: string
    StaffImportPreview:
      type: object
      required: [rows, errors]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [line, staff_no, email, display_name, department_id]
            properties:
              line: {type: integer}
              staff_no: {type: string}
              email: {type: string, format: email}
              display_name: {type: string}
              department_id: {type: string, format: uuid}
        errors:
          type: array
          items:
            type: object
            required: [line, message]
            properties:
              line: {type: integer}
              column: {type: string}
              message: {type: string}
    AutoTarget:
      type: object
      required: [department_id, level]
      additionalProperties: false
      properties:
        department_id:
          type: string
          format: uuid
        level:
          type: integer
          minimum: 1
          maximum: 1000
    OfferingLecturer:
      type: object
      required: [id, display_name, email]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        email: {type: string, format: email}
    DirectoryUser:
      type: object
      required: [id, display_name, email, roles]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        email: {type: string, format: email}
        roles:
          type: array
          items:
            type: object
            required: [role, scope_type, scope_id]
            properties:
              role: {type: string}
              scope_type: {type: string}
              scope_id:
                oneOf:
                  - {type: string, format: uuid}
                  - {type: "null"}
    TimetableSlot:
      type: object
      required: [id, offering_id, venue_id, weekday, starts_at, ends_at]
      properties:
        id: {type: string, format: uuid}
        offering_id: {type: string, format: uuid}
        venue_id: {type: string, format: uuid}
        venue_name: {type: string}
        weekday: {type: integer, minimum: 0, maximum: 6}
        starts_at: {type: string, format: time}
        ends_at: {type: string, format: time}
        next_at: {type: string, format: date-time}
    PagedCatalogueItems:
      type: object
      required: [items, limit, offset, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueItem"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    PagedMyOfferings:
      type: object
      required: [items, limit, offset, has_more]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CatalogueItem"
              - type: object
                required: [session_open, next_timetable_slot]
                properties:
                  session_open: {type: boolean}
                  next_timetable_slot:
                    oneOf:
                      - $ref: "#/components/schemas/TimetableSlot"
                      - type: "null"
        limit: {type: integer}
        offset: {type: integer}
        has_more: {type: boolean}
    PagedSearchOfferings:
      type: object
      required: [items, limit, offset, has_more]
      properties:
        items:
          type: array
          items:
            type: object
            required: [offering_id, course_id, course_code, course_title, department_id, department_name, level, kind, registration_mode, lecturers, registration_status, is_registered, is_pending]
            properties:
              offering_id: {type: string, format: uuid}
              course_id: {type: string, format: uuid}
              course_code: {type: string}
              course_title: {type: string}
              code: {type: string}
              title: {type: string}
              department_id: {type: string, format: uuid}
              department_name: {type: string}
              level: {type: integer}
              kind: {type: string, enum: [departmental, general]}
              registration_mode: {type: string, enum: [auto, open, approval, closed]}
              lecturers: {type: array, items: {type: string}}
              registration_status: {type: string, enum: [none, pending, approved, rejected]}
              is_registered: {type: boolean}
              is_pending: {type: boolean}
              semester_id: {type: string, format: uuid}
              semester: {type: string}
              rank: {type: number}
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    Registration:
      type: object
      required: [student_id, status, on_roster]
      properties:
        student_id:
          type: string
          format: uuid
        matric_no:
          type: string
        display_name:
          type: string
        department_id:
          type: string
          format: uuid
        level:
          type: integer
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
          format: date-time
        approved_at:
          type: [string, "null"]
          format: date-time
        on_roster:
          type: boolean
    RegistrationApproval:
      allOf:
        - $ref: "#/components/schemas/Registration"
        - type: object
          required: [offering_id, course_code, course_title]
          properties:
            offering_id: {type: string, format: uuid}
            course_code: {type: string}
            course_title: {type: string}
    RegistrationPage:
      type: object
      required: [items, limit, offset, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Registration"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    SessionReportPage:
      type: object
      required: [session_id, scanner_coverage, items, limit, offset, has_more]
      properties:
        session_id:
          type: string
          format: uuid
        scanner_coverage:
          $ref: "#/components/schemas/ScannerCoverage"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceReportItem"
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    ScannerCoverage:
      type: object
      required: [state, offline_intervals]
      properties:
        state:
          type: string
          enum: [full, partial, none, no_scanner]
        offline_intervals:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
    AttendanceReportItem:
      type: object
      required: [student_record_id, matric_no, display_name, department_id, level, on_roster, classification, status]
      properties:
        student_record_id:
          type: string
          format: uuid
        matric_no:
          type: string
        display_name:
          type: string
        department_id:
          type: string
          format: uuid
        level:
          type: integer
        on_roster:
          type: boolean
        classification:
          type: string
          enum: [verified, suspected_proxy, present_no_web_log, web_only_unverified, absent, excused]
        status:
          type: string
        reason:
          type: string
    RosterPage:
      type: object
      required: [session_id, items, limit, offset, has_more]
      properties:
        session_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            required: [student_record_id, matric_no, display_name, department_id, department_name, level]
            properties:
              student_record_id: {type: string, format: uuid}
              matric_no: {type: string}
              display_name: {type: string}
              department_id: {type: string, format: uuid}
              department_name: {type: string}
              level: {type: integer}
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
    BulkOverrideRequest:
      type: object
      required: [student_ids, status, reason_code]
      additionalProperties: false
      properties:
        student_ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [present, absent, late, excused]
        reason_code:
          type: string
          enum: [power_outage, device_failure, official_duty, medical, other]
        note:
          type: string
          maxLength: 1000
    BulkOverrideResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [student_id, applied]
            properties:
              student_id:
                type: string
                format: uuid
              applied:
                type: boolean
              error_code:
                type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    TokenResponse:
      type: object
      required: [access_token, expires_in, force_password_change]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          example: 900
        force_password_change:
          type: boolean
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      required: [id, name, email, status, must_change_password, roles]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        must_change_password:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
    UserRole:
      type: object
      required: [role, scope_type, scope_id]
      properties:
        role:
          type: string
          enum: [platform_admin, institution_admin, faculty_admin, department_admin, lecturer, student]
        scope_type:
          type: string
          enum: [platform, institution, faculty, department]
        scope_id:
          type: [string, "null"]
          format: uuid
        department_id:
          type: string
          format: uuid
          description: Present for student roles; identifies the locked home department.
        level:
          type: integer
          description: Present for student roles; identifies the locked academic level.
    CheckinRequest:
      type: object
      required: [session_id, code, lat, lng, accuracy]
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracy:
          type: number
          minimum: 0
        device_hash:
          type: string
    CheckinResponse:
      type: object
      required: [session_id, status, on_roster, accuracy_poor, distance_meters]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [present, late]
        on_roster:
          type: boolean
        accuracy_poor:
          type: boolean
        distance_meters:
          type: number
    StartSessionRequest:
      type: object
      required: [offering_id, venue_id]
      additionalProperties: false
      properties:
        offering_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        timetable_id:
          type: string
          format: uuid
        rotating_code:
          type: boolean
          default: true
        late_after_min:
          type: integer
          minimum: 0
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radius_meters:
          type: integer
          minimum: 1
    Session:
      type: object
      required: [id, offering_id, venue_id, started_at, latitude, longitude, radius_meters, rotating_code, late_after_min]
      properties:
        id:
          type: string
          format: uuid
        offering_id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        latitude:
          type: number
        longitude:
          type: number
        radius_meters:
          type: number
        rotating_code:
          type: boolean
        late_after_min:
          type: integer
          minimum: 0
    SessionCodeResponse:
      type: object
      required: [session, code, seconds_remaining]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        code:
          type: string
          pattern: "^[0-9]{6}$"
        seconds_remaining:
          type: integer
    DeviceTasks:
      type: object
      required: [active_session, pending_enrolment, server_time]
      properties:
        active_session:
          oneOf:
            - $ref: "#/components/schemas/ActiveDeviceSession"
            - type: "null"
        pending_enrolment:
          oneOf:
            - $ref: "#/components/schemas/PendingEnrolment"
            - type: "null"
        server_time:
          type: string
          format: date-time
    ActiveDeviceSession:
      type: object
      required: [id, venue_id]
      properties:
        id:
          type: string
          format: uuid
        venue_id:
          type: string
          format: uuid
    PendingEnrolment:
      type: object
      required: [id, student_ref, slot_id, slot_number]
      properties:
        id:
          type: string
          format: uuid
        student_ref:
          type: string
        slot_id:
          type: string
          format: uuid
        slot_number:
          description: The integer sensor position (1-based) to enrol this student into. Null only if the task has no assigned slot.
          oneOf:
            - {type: integer, minimum: 1}
            - {type: "null"}
    DeviceScanRequest:
      type: object
      required: [slot_number, confidence]
      additionalProperties: false
      properties:
        slot_number:
          type: integer
          minimum: 1
          description: The integer sensor position the fingerprint matched, as assigned by enrolment or template sync.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        client_scanned_at:
          type: string
          format: date-time
          description: Omit for a live scan; set to the capture time (RFC3339) only when flushing a queued offline scan.
    DeviceScanResponse:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        duplicate:
          type: boolean
        error_code:
          type: string
    DeviceProvisionRequest:
      type: object
      required: [venue_id, name]
      additionalProperties: false
      properties:
        venue_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
    PairingCode:
      type: object
      required: [device_id, pairing_code, pairing_code_expires_at]
      description: A one-time pairing code shown to the administrator exactly once.
      properties:
        device_id:
          type: string
          format: uuid
        pairing_code:
          type: string
          description: Short code to flash into the scanner firmware, e.g. "K7QF-2M9X".
        pairing_code_expires_at:
          type: string
          format: date-time
    ProvisionedDevice:
      type: object
      required: [device, pairing]
      properties:
        device:
          $ref: "#/components/schemas/DeviceListItem"
        pairing:
          $ref: "#/components/schemas/PairingCode"
    DeviceListItem:
      type: object
      required: [id, name, venue_id, venue_name, status]
      description: >-
        A scanner summary. status is "unpaired" (no key yet, awaiting pairing),
        "active" (paired and usable), or "revoked" (soft-disabled). The pairing
        code itself is never returned here, only its expiry when one is outstanding.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        venue_id: {type: string, format: uuid}
        venue_name: {type: string}
        department_id:
          oneOf:
            - {type: string, format: uuid}
            - {type: "null"}
        status: {type: string, enum: [unpaired, active, revoked]}
        last_seen_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
        paired_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
        firmware_version:
          oneOf:
            - {type: string}
            - {type: "null"}
        battery_percent:
          oneOf:
            - {type: integer, minimum: 0, maximum: 100}
            - {type: "null"}
        pending_queue_depth:
          oneOf:
            - {type: integer, minimum: 0}
            - {type: "null"}
        status_reported_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
        pairing_code_expires_at:
          oneOf:
            - {type: string, format: date-time}
            - {type: "null"}
    DevicePairResponse:
      type: object
      required: [device_key, device_id, institution_id, venue_id]
      properties:
        device_key:
          type: string
          description: The permanent key the firmware stores and sends as X-Device-Key.
        device_id: {type: string, format: uuid}
        institution_id: {type: string, format: uuid}
        venue_id: {type: string, format: uuid}
    DeviceStatusRequest:
      type: object
      additionalProperties: false
      properties:
        firmware_version: {type: string}
        battery_percent: {type: integer, minimum: 0, maximum: 100}
        pending_queue_depth: {type: integer, minimum: 0}
        free_storage_bytes: {type: integer, format: int64, minimum: 0}
    EnrolmentEnqueueResponse:
      type: object
      required: [task_id, slot_number, status]
      properties:
        task_id: {type: string, format: uuid}
        slot_number: {type: integer, minimum: 1}
        status: {type: string, enum: [pending]}
    DeviceTemplateSync:
      type: object
      required: [session_id, slots, server_time]
      properties:
        session_id: {type: string, format: uuid}
        server_time: {type: string, format: date-time}
        slots:
          type: array
          items:
            type: object
            required: [slot_number, student_record_id, student_ref, template]
            properties:
              slot_number: {type: integer, minimum: 1, description: Sensor position to load this template into.}
              student_record_id: {type: string, format: uuid}
              student_ref: {type: string, description: "The student's matric number, for display/logging."}
              template: {type: string, description: Base64-encoded fingerprint template to load into the sensor at slot_number.}
  responses:
    InvalidJSON:
      description: Request JSON is invalid or contains unknown fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: invalid_json
              message: Request body is invalid
              details: {}
    Unauthorized:
      description: Missing, expired, or invalid access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidCredentials:
      description: Email or password is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: invalid_credentials
              message: Email or password is invalid
              details: {}
    InvalidRefresh:
      description: Refresh cookie is missing, expired, revoked, or already used.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: invalid_refresh_token
              message: Refresh token is missing or invalid
              details: {}
    InvalidDeviceKey:
      description: Missing, invalid, or revoked device key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Endpoint-specific request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected internal failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
