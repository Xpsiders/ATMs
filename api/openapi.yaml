openapi: 3.1.0
info:
  title: Campus Attendance API
  version: 0.2.0
  description: Campus Attendance API. Routes are described only where they are implemented; PostgreSQL-backed organization, catalogue, registration, session report, roster, and bulk attendance override routes are included.
servers:
  - url: http://localhost:8080
paths:
  /public/departments:
    get:
      operationId: listPublicDepartments
      summary: List an institution's departments (unauthenticated)
      description: Read-only department id/name/code for the pre-login claim and signup screens, so they can show a department name picker instead of asking for a UUID. Scoped to the given institution.
      security: []
      parameters:
        - name: institution_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Departments in the institution.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, code]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        code: {type: string}
        "400":
          description: Missing or invalid institution_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: getHealth
      summary: Check process liveness
      security: []
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
  /readyz:
    get:
      operationId: getReadiness
      summary: Check database readiness
      security: []
      responses:
        "200":
          description: The API can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ready
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: database_unavailable
                  message: Database is not ready
                  details: {}
  /auth/login:
    post:
      operationId: login
      summary: Authenticate a user and issue access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institution_id, email, password]
              properties:
                institution_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              institution_id: 2f4e4ed0-490c-4cba-9343-62b0744d6ba7
              email: student@example.test
              password: CorrectHorseBatteryStaple
      responses:
        "200":
          description: Access token returned in the body; refresh token set as a Secure, HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: attendance_refresh cookie, scoped to /auth.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.example.signature
                expires_in: 900
                force_password_change: false
                must_change_password: false
                id: 45a29ed4-00d8-44fd-bdfc-82dd15c1fba0
                name: Alex Student
                email: student@example.test
                status: active
                roles:
                  - role: student
                    scope_type: department
                    scope_id: 10000000-0000-4000-8000-000000000003
                    department_id: 10000000-0000-4000-8000-000000000003
                    level: 200
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          description: Student email has not been verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: email_not_verified
                  message: Student email has not been verified
                  details: {}
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user's profile and scoped roles
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile. Student roles include the locked home department and level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
              example:
                id: 45a29ed4-00d8-44fd-bdfc-82dd15c1fba0
                name: Alex Student
                email: student@example.test
                status: active
                must_change_password: false
                roles:
                  - role: student
                    scope_type: department
                    scope_id: 10000000-0000-4000-8000-000000000003
                    department_id: 10000000-0000-4000-8000-000000000003
                    level: 200
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Authenticated user no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/courses:
    get:
      operationId: getMyCourses
      summary: List the authenticated student's approved courses in the current semester
      description: Returns only the caller's approved registrations. Attendance percentages count late as attended only when the offering allows it; attendance overrides take precedence over check-in evidence.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current-semester courses with attendance summaries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [offering_id, course_code, course_title, lecturer_names, sessions_held, sessions_attended, attendance_percentage, minimum_attendance_percentage, below_threshold]
                      properties:
                        offering_id: {type: string, format: uuid}
                        course_code: {type: string}
                        course_title: {type: string}
                        lecturer_names: {type: array, items: {type: string}}
                        sessions_held: {type: integer, minimum: 0}
                        sessions_attended: {type: integer, minimum: 0}
                        attendance_percentage: {type: number, minimum: 0, maximum: 100}
                        minimum_attendance_percentage: {type: number, minimum: 0, maximum: 100}
                        below_threshold: {type: boolean}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user is not a claimed student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/timetable:
    get:
      operationId: getMyTimetable
      summary: List the authenticated student's approved offering timetable for a date
      description: The date defaults to today in Africa/Lagos. Entries are limited to the caller's approved offerings.
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          description: Local calendar date in Africa/Lagos; defaults to today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Timetable entries for the requested local date.
          content:
            application/json:
              schema:
                type: object
                required: [date, items]
                properties:
                  date: {type: string, format: date}
                  items:
                    type: array
                    items:
                      type: object
                      required: [offering_id, course_code, course_title, venue_id, venue_name, starts_at, ends_at, live_now]
                      properties:
                        offering_id: {type: string, format: uuid}
                        course_code: {type: string}
                        course_title: {type: string}
                        venue_id: {type: string, format: uuid}
                        venue_name: {type: string}
                        starts_at: {type: string, format: time}
                        ends_at: {type: string, format: time}
                        live_now: {type: boolean}
        "400":
          description: The date is not a valid YYYY-MM-DD date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user is not a claimed student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/attendance:
    get:
      operationId: getMyAttendance
      summary: List the authenticated student's attendance history for an approved offering
      description: The requested offering must be approved for the caller. Override status takes precedence over web or scanner evidence; override reason is returned as text.
      security:
        - BearerAuth: []
      parameters:
        - name: offering_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Per-session attendance history.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [session_id, date, status, classification]
                      properties:
                        session_id: {type: string, format: uuid}
                        date: {type: string, format: date}
                        status: {type: string, enum: [present, late, absent, excused]}
                        classification: {type: string, enum: [verified, suspected_proxy, present_no_web_log, web_only_unverified, absent, excused]}
                        override_reason: {type: [string, "null"]}
        "400":
          description: offering_id is missing or is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user is not a claimed student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Offering is not approved for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/registrations:
    get:
      operationId: getMyPendingRegistrations
      summary: List the authenticated student's pending registration requests
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Pending registrations belonging only to the authenticated student.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [offering_id, course_code, course_title, status, created_at]
                      properties:
                        offering_id: {type: string, format: uuid}
                        course_code: {type: string}
                        course_title: {type: string}
                        status: {type: string, enum: [pending]}
                        created_at: {type: string, format: date-time}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user is not a claimed student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/live-classes:
    get:
      operationId: getMyLiveClasses
      summary: List open sessions for the authenticated student's approved registrations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Sessions open for offerings where the authenticated student has an approved registration. Never includes attendance codes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [session_id, offering_id, course_code, course_title, venue_id, venue_name, lecturer_name, started_at, late_after_min, rotating_code, already_checked_in]
                      properties:
                        session_id: {type: string, format: uuid}
                        offering_id: {type: string, format: uuid}
                        course_code: {type: string}
                        course_title: {type: string}
                        venue_id: {type: string, format: uuid}
                        venue_name: {type: string}
                        lecturer_name: {type: string}
                        started_at: {type: string, format: date-time}
                        late_after_min: {type: integer}
                        rotating_code: {type: boolean}
                        already_checked_in: {type: boolean}
              example:
                items:
                  - session_id: 10000000-0000-4000-8000-000000000027
                    offering_id: 10000000-0000-4000-8000-000000000010
                    course_code: ECE301
                    course_title: Circuits and Systems
                    venue_id: 10000000-0000-4000-8000-000000000012
                    venue_name: Engineering Hall
                    lecturer_name: Lecturer A
                    started_at: "2026-10-20T10:00:00Z"
                    late_after_min: 10
                    rotating_code: true
                    already_checked_in: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user is not a claimed student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/offerings:
    get:
      operationId: getMyOfferings
      summary: List catalogue offerings visible to the authenticated user, including lecturer assignments
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated offering list filtered by the authenticated user's resource visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedMyOfferings"
        "400":
          description: Invalid limit or offset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /venues:
    get:
      operationId: listVenues
      summary: List venues in the authenticated user's institution
      description: Accessible only to lecturers and platform, institution, faculty, or department administrators. Venue results never cross the authenticated institution.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated institution venues with the total number of matching venues.
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, total]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, latitude, longitude, radius_meters, active]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        latitude: {type: number}
                        longitude: {type: number}
                        radius_meters: {type: integer}
                        active: {type: boolean}
                        department_id: {type: string, format: uuid}
                  limit: {type: integer}
                  offset: {type: integer}
                  total: {type: integer}
        "400":
          description: Invalid limit or offset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not a lecturer or administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createVenue
      summary: Create an institution venue
      description: Scoped institution, faculty, and department administrators can create venues within their authority.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, latitude, longitude, radius_meters]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                latitude: {type: number, minimum: -90, maximum: 90}
                longitude: {type: number, minimum: -180, maximum: 180}
                radius_meters: {type: integer, minimum: 1}
                department_id: {type: string, format: uuid}
      responses:
        "201": {description: Venue created., content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage venues., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /venues/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateVenue
      summary: Update a venue
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                latitude: {type: number, minimum: -90, maximum: 90}
                longitude: {type: number, minimum: -180, maximum: 180}
                radius_meters: {type: integer, minimum: 1}
                active: {type: boolean}
                department_id: {type: string, format: uuid}
      responses:
        "200": {description: Venue updated., content: {application/json: {schema: {type: object}}}}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this venue., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: Venue not found., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: deactivateVenue
      summary: Deactivate a venue without removing attendance history
      security:
        - BearerAuth: []
      responses:
        "204": {description: Venue deactivated.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this venue., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: Venue not found., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/refresh:
    post:
      operationId: refreshAccessToken
      summary: Rotate refresh cookie and issue a new access token
      security:
        - RefreshCookie: []
      responses:
        "200":
          description: Refresh token rotated and access token returned.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/InvalidRefresh"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh token
      security:
        - RefreshCookie: []
      responses:
        "204":
          description: Refresh cookie revoked and cleared.
        "401":
          $ref: "#/components/responses/InvalidRefresh"
  /auth/password/change:
    post:
      operationId: changePassword
      summary: Change password and clear the forced-change flag
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 72
      responses:
        "200":
          description: Password changed; replacement access token no longer requires a change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Missing/invalid bearer token or current password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No authenticated user context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset without revealing account existence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institution_id, email]
              properties:
                institution_id: {type: string, format: uuid}
                email: {type: string, format: email}
      responses:
        "202": {description: A generic acknowledgement is returned for all valid requests., content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [request_received]}}}}}}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Reset a password using a one-time email code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institution_id, email, code, new_password]
              properties:
                institution_id: {type: string, format: uuid}
                email: {type: string, format: email}
                code: {type: string, pattern: "^[0-9]{6}$"}
                new_password: {type: string, format: password, minLength: 12, maxLength: 72}
      responses:
        "200": {description: Password reset and forced-change flag cleared.}
        "400": {description: Request or reset code is invalid., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/signup-claim:
    post:
      operationId: startStudentClaim
      summary: Begin a student record claim or request approval for an unknown matric number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institution_id, matric_no, email, department_id]
              additionalProperties: false
              properties:
                institution_id:
                  type: string
                  format: uuid
                matric_no:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 254
                department_id:
                  type: string
                  format: uuid
            example:
              institution_id: 2f4e4ed0-490c-4cba-9343-62b0744d6ba7
              matric_no: MAT001
              email: student@example.test
              department_id: 10000000-0000-4000-8000-000000000003
      responses:
        "202":
          description: Enumeration-safe acknowledgement. A verification email is sent only when the matric number and submitted email match an unclaimed record; otherwise an unknown-matric approval request is created or no action is taken.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: string
                    enum: [request_received]
                  message:
                    type: string
        "400":
          description: Request body or fields are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/verify-email:
    post:
      operationId: verifyStudentEmail
      summary: Consume a one-time email code, claim the student record, and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institution_id, matric_no, code, password]
              additionalProperties: false
              properties:
                institution_id:
                  type: string
                  format: uuid
                matric_no:
                  type: string
                  maxLength: 100
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 72
      responses:
        "201":
          description: Student claimed, access token returned, refresh token set as a Secure HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request, password, or verification code. Invalid, expired, used, and already-claimed records use the same verification error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Verification attempts are limited to five requests per minute per client IP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /invitations:
    post:
      operationId: createInvitation
      summary: Invite a staff member into a scoped role
      description: The authenticated administrator can invite only roles and scopes they manage. An invitation token and institution ID are sent to the supplied email and are valid for seven days. Platform administrator invitations are not supported.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, scope_type]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                role:
                  type: string
                  enum: [institution_admin, faculty_admin, department_admin, lecturer]
                scope_type:
                  type: string
                  enum: [institution, faculty, department]
                faculty_id:
                  type: string
                  format: uuid
                department_id:
                  type: string
                  format: uuid
            example:
              email: lecturer@example.test
              role: lecturer
              scope_type: department
              department_id: 2f4e4ed0-490c-4cba-9343-62b0744d6ba7
      responses:
        "202":
          description: Invitation email was sent.
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_at]
                properties:
                  status:
                    type: string
                    enum: [invitation_sent]
                  expires_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Requested role or resource scope is outside the caller's authority.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: An account with the invited email already exists in this institution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept a staff invitation and create the scoped account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institution_id, token, display_name, password]
              additionalProperties: false
              properties:
                institution_id:
                  type: string
                  format: uuid
                token:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{43}$"
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 72
      responses:
        "201":
          description: Account created, access token returned, and refresh cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Request, password, or invitation token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Invitation email already has an account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /imports/students/preview:
    post:
      operationId: previewStudentImport
      summary: Validate a student CSV without saving any rows
      description: CSV headers are matric_no, email, display_name, department_id, and level. The upload is limited to 5 MiB. Every target department must be in the authenticated user's management scope. PII in CSV rows is not written to application logs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
            example: |
              matric_no,email,display_name,department_id,level
              MAT200A,student-200a@attendance.test,Bailey Demo,10000000-0000-4000-8000-000000000003,200
      responses:
        "200":
          description: Parsed rows and row-level validation errors. No data is committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentImportPreview"
        "400":
          description: Missing/invalid CSV headers or malformed upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: CSV exceeds the 5 MiB upload limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /imports/students:
    post:
      operationId: commitStudentImport
      summary: Commit a validated student CSV import
      description: Uses the same CSV headers and limit as the preview endpoint. Validation is repeated at commit time. If any row fails validation, no rows are committed. The database transaction is all-or-nothing.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: All valid student records were committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentImportPreview"
        "400":
          description: CSV structure or header is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: CSV exceeds the 5 MiB upload limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: At least one row failed validation; no rows were committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentImportPreview"
        "409":
          description: A matric number was inserted concurrently after validation; the transaction was rolled back. Error code is matric_number_conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /imports/staff/preview:
    post:
      operationId: previewStaffImport
      summary: Validate staff CSV rows without committing them
      description: Headers are staff_no, email, display_name, and department_id. Lecturer invitations are created only during the atomic commit.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
      responses:
        "200": {description: Parsed rows and row-level validation errors., content: {application/json: {schema: {$ref: "#/components/schemas/StaffImportPreview"}}}}
        "400": {description: CSV structure is invalid., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {description: CSV exceeds 5 MiB., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /imports/staff:
    post:
      operationId: commitStaffImport
      summary: Atomically create staff records and lecturer invitations from CSV
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
      responses:
        "201": {description: All validated staff rows and corresponding invitations were committed., content: {application/json: {schema: {$ref: "#/components/schemas/StaffImportPreview"}}}}
        "400": {description: CSV structure is invalid., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {description: CSV exceeds 5 MiB., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "409": {description: Import data changed after validation., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "422": {description: At least one row failed; no rows were committed., content: {application/json: {schema: {$ref: "#/components/schemas/StaffImportPreview"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /users:
    get:
      operationId: listDirectoryUsers
      summary: Search the scoped user directory for lecturer and administrator pickers
      description: >-
        Returns users within the caller's administrator authority: a department
        admin sees only users in their department, a faculty admin only within
        their faculty, and an institution admin only within their institution.
        Callers without administrator authority receive 403.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive search over display name and email.
          schema: {type: string}
        - name: role
          in: query
          required: false
          description: Filter to users holding this role.
          schema: {type: string, enum: [student, lecturer, department_admin, faculty_admin, institution_admin]}
        - name: department_id
          in: query
          required: false
          description: Filter to users holding a role in this department.
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Scoped, paginated directory users.
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, has_more]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/DirectoryUser"}}
                  limit: {type: integer}
                  offset: {type: integer}
                  has_more: {type: boolean}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot read the user directory., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /devices:
    post:
      operationId: provisionDevice
      summary: Provision a scanner and issue a one-time pairing code
      description: >-
        Registers a scanner for a venue and returns a short pairing code to flash
        into the device firmware. The code is shown once; the firmware redeems it
        at POST /device/pair to receive its permanent device key. Allowed for
        administrators with authority over the venue's department, or for a
        lecturer who teaches at the venue.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProvisionRequest"
      responses:
        "201": {description: Scanner provisioned; pairing code shown once., content: {application/json: {schema: {$ref: "#/components/schemas/ProvisionedDevice"}}}}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage devices in this scope., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
    get:
      operationId: listDevices
      summary: List scanners within the caller's scope
      description: Returns scanners the caller may manage - within an administrator's department/faculty/institution authority, plus venues a lecturer teaches at.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Scoped, paginated scanners with health and pairing status.
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset, has_more]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/DeviceListItem"}}
                  limit: {type: integer}
                  offset: {type: integer}
                  has_more: {type: boolean}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage devices in this scope., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /devices/{id}/pairing-code:
    post:
      operationId: regenerateDevicePairingCode
      summary: Issue a fresh pairing code for a scanner
      description: Replaces any outstanding pairing code without changing an already-paired key. Allowed for administrators over the venue's department or a lecturer who teaches at the venue.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "201": {description: New pairing code shown once., content: {application/json: {schema: {$ref: "#/components/schemas/PairingCode"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this device., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: Device not found., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /devices/{id}/rotate-key:
    post:
      operationId: rotateDeviceKey
      summary: Invalidate a scanner's key and issue a new pairing code
      description: Clears the current device key so the scanner must re-pair with the returned code before it can send data again. Allowed for administrators over the venue's department or a lecturer who teaches at the venue.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "201": {description: Key rotated; new pairing code shown once., content: {application/json: {schema: {$ref: "#/components/schemas/PairingCode"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this device., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: Device not found., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /devices/{id}:
    delete:
      operationId: revokeDevice
      summary: Revoke (soft-disable) a scanner
      description: Disables the scanner so its key is rejected immediately. The record is retained for audit and reporting. Allowed for administrators over the venue's department or a lecturer who teaches at the venue.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204": {description: Device revoked.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this device., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: Device not found., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /devices/{id}/enrolments:
    post:
      operationId: enqueueDeviceEnrolment
      summary: Queue a student for fingerprint enrolment on a scanner
      description: Assigns the next device slot to the student and creates a pending enrolment task the scanner picks up from GET /device/tasks. Allowed for administrators over the venue's department or a lecturer who teaches at the venue.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_record_id]
              additionalProperties: false
              properties:
                student_record_id: {type: string, format: uuid}
      responses:
        "201": {description: Enrolment queued., content: {application/json: {schema: {$ref: "#/components/schemas/EnrolmentEnqueueResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this device., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: Device or student record not found., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /signup-requests:
    get:
      operationId: listSignupRequests
      summary: List pending signup requests in the administrator's departments
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": {description: Scoped pending signup requests., content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot review signup requests., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /signup-requests/{id}/review:
    post:
      operationId: reviewSignupRequest
      summary: Approve or reject a signup request
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [approved, rejected]}
                department_id: {type: string, format: uuid}
                level: {type: integer, minimum: 1}
                programme_id: {type: string, format: uuid}
                display_name: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200": {description: "Request reviewed; approval requires department_id, level, programme_id, and display_name, creates the student record, and writes an audit event."}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Request is outside caller department scope., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: Request not found or no longer pending., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /role-assignments:
    post:
      operationId: createRoleAssignment
      summary: Assign a department or faculty administrator role
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role, scope_type]
              properties:
                user_id: {type: string, format: uuid}
                role: {type: string, enum: [faculty_admin, department_admin]}
                scope_type: {type: string, enum: [faculty, department]}
                faculty_id: {type: string, format: uuid}
                department_id: {type: string, format: uuid}
      responses:
        "201": {description: Scoped role assigned and audit event written.}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Requested role or scope is outside caller authority., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "409": {description: Role assignment already exists., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "500": {$ref: "#/components/responses/InternalError"}
  /checkins:
    post:
      operationId: createWebCheckin
      summary: Check in to one specific open session
      description: The session ID is mandatory; the supplied code is verified only for that session.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinRequest"
            example:
              session_id: 2f4e4ed0-490c-4cba-9343-62b0744d6ba7
              code: "038419"
              lat: 6.5244
              lng: 3.3792
              accuracy: 8.5
              device_hash: optional-client-device-fingerprint
      responses:
        "201":
          description: Check-in recorded; accuracy over 100 metres is advisory only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinResponse"
              example:
                session_id: 2f4e4ed0-490c-4cba-9343-62b0744d6ba7
                status: present
                on_roster: true
                accuracy_poor: false
                distance_meters: 18.6
        "400":
          description: Invalid JSON/location, wrong or expired code, not on roster, or outside radius.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                wrongCode:
                  value:
                    error:
                      code: wrong_or_expired_code
                      message: Session code is wrong or expired
                      details: {}
                outsideRadius:
                  value:
                    error:
                      code: outside_radius
                      message: Student is outside the allowed check-in radius
                      details: {}
                notOnRoster:
                  value:
                    error:
                      code: not_on_roster
                      message: Student is not registered for this offering
                      details: {}
        "401":
          description: Missing, expired, or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated principal is not a student or must change password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Duplicate check-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: already_checked_in
                  message: Student has already checked in
                  details: {}
  /sessions:
    post:
      operationId: startSession
      summary: Start a lecture session at a venue
      description: The venue location and radius are copied by default; explicitly supplied values adjust the session snapshot. Only assigned offering lecturers and coordinators may start sessions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
            example:
              offering_id: 4c39d74e-7b7c-4cb0-8bd5-c8274905e3ce
              venue_id: 48c5efb3-9651-478d-9d70-bb5be469f62f
              rotating_code: true
              late_after_min: 10
      responses:
        "201":
          description: Session started and current attendance code returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCodeResponse"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: User is not assigned to this offering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Venue does not exist in the authenticated institution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Another session is open at this venue; details.session_id identifies it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/end:
    post:
      operationId: endSession
      summary: End an open lecture session
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session ended; subsequent attendance changes require an audited override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Session ID is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: User is not assigned to the session offering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Session is already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /sessions/{id}:
    patch:
      operationId: convertSessionToFixedCode
      summary: Convert a rotating session code to a fixed code
      description: Lecturer or offering coordinator only. One-way conversion; the generated six-digit code remains valid until the session ends. The conversion and audit entry are written atomically.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rotating]
              additionalProperties: false
              properties:
                rotating:
                  type: boolean
                  enum: [false]
            example:
              rotating: false
      responses:
        "200":
          description: Session code converted; plaintext fixed code returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCodeResponse"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: User is not an assigned lecturer or coordinator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Session is closed or already uses a fixed code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/live:
    get:
      operationId: getLiveSessionRoster
      summary: Get live attendance counts and a page of current roster status
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Current session counts and paginated roster; suitable for polling.
          content:
            application/json:
              schema:
                type: object
                required: [session_id, counts, items, limit, offset, has_more]
