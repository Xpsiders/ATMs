      responses:
        "200": {description: Offering., content: {application/json: {schema: {$ref: "#/components/schemas/CatalogueItem"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: Offering not found., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
