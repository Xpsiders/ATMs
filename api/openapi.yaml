  /sessions/{id}/scanner-status:
    post:
      operationId: markSessionScannerUnavailable
      summary: Record scanner unavailability for an open session
      description: Assigned lecturer or coordinator can manually declare a scanner outage. The state update and audit record are atomic; reports treat web check-ins during the resulting full-session offline interval as web_only_unverified.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, note]
              additionalProperties: false
              properties:
                state:
                  type: string
                  enum: [unavailable]
                note:
                  type: string
                  minLength: 1
                  maxLength: 1000
            example:
              state: unavailable
              note: Scanner lost power during the lecture
      responses:
        "200":
          description: Scanner outage status was recorded.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    const: unavailable
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: User is not an assigned lecturer or coordinator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Session is already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/code:
    get:
      operationId: getSessionCode
      summary: Get the current attendance code for an open session
      description: Rotating codes change per configured window, and the current code plus seconds remaining is returned. A fixed code created at session start expires at its stored expiry time; a code created by one-way conversion remains valid until session end.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current session code and seconds until expiry or rotation; converted fixed codes do not expire before session end.
