      responses:
        "200": {description: Course., content: {application/json: {schema: {$ref: "#/components/schemas/CatalogueItem"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: Course not found., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
    patch:
      operationId: updateCourse
      summary: Update a course
      security: [{BearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties: {department_id: {type: string, format: uuid}, code: {type: string}, title: {type: string}, kind: {type: string, enum: [departmental, general]}, description: {type: string}, credits: {type: integer}}
      responses:
        "200": {description: Updated course., content: {application/json: {schema: {$ref: "#/components/schemas/CatalogueItem"}}}}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
