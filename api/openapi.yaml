            application/json:
              schema:
                $ref: "#/components/schemas/SessionCodeResponse"
        "400":
          description: Session ID is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: User is not assigned to the session offering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Session is closed or its static code has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
