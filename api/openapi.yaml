              properties: {course_id: {type: string, format: uuid}, semester_id: {type: string, format: uuid}, coordinator_user_id: {type: string, format: uuid}, level: {type: integer}, registration_mode: {type: string, enum: [auto, open, approval, closed]}, roster_policy: {type: string, enum: [registered_only, open]}, min_attendance_pct: {type: number}, late_counts_as_attended: {type: boolean}}
      responses:
        "200": {description: Updated offering., content: {application/json: {schema: {$ref: "#/components/schemas/CatalogueItem"}}}}
        "400": {$ref: "#/components/responses/InvalidJSON"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this offering., content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
    delete:
